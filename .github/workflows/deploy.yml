name: Deploy to EC2

on:
  push:
    branches: [trunk]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime_api
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime_web
          push: true
          tags: ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_USER_PASSWORD: ${{ secrets.EMAIL_USER_PASSWORD }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          envs: DB_HOST,DB_PASSWORD,JWT_SECRET,COOKIE_SECRET,EMAIL_USER,EMAIL_USER_PASSWORD,FRONTEND_URL,GITHUB_REPOSITORY
          script: |
            cd /opt/dharma
            export DB_HOST="$DB_HOST"
            export DB_PASSWORD="$DB_PASSWORD"
            export JWT_SECRET="$JWT_SECRET"
            export COOKIE_SECRET="$COOKIE_SECRET"
            export EMAIL_USER="$EMAIL_USER"
            export EMAIL_USER_PASSWORD="$EMAIL_USER_PASSWORD"
            export FRONTEND_URL="$FRONTEND_URL"
            export GITHUB_REPOSITORY="$GITHUB_REPOSITORY"
            bash deploy/deploy.sh
