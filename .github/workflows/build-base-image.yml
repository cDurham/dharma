name: Build Base Image

on:
  push:
    branches: [trunk]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile.base'
  workflow_dispatch:

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set lowercase repository name
        id: repo
        run: echo "repository_lower=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      - name: Generate cache key from package-lock.json
        id: cache-key
        run: |
          HASH=$(sha256sum package-lock.json | cut -d' ' -f1 | cut -c1-12)
          echo "hash=${HASH}" >> $GITHUB_OUTPUT
          echo "Base image will be tagged with: ${HASH}"
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Check if base image already exists
        id: check
        run: |
          if docker manifest inspect ghcr.io/${{ steps.repo.outputs.repository_lower }}/dharma-base:${{ steps.cache-key.outputs.hash }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Base image with this hash already exists, skipping build"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "📦 Base image needs to be built"
          fi
      
      - name: Build and push base image (dev dependencies)
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.base
          target: final-dev
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repository_lower }}/dharma-base:${{ steps.cache-key.outputs.hash }}
            ghcr.io/${{ steps.repo.outputs.repository_lower }}/dharma-base:latest
          cache-from: type=gha,scope=base-dev
          cache-to: type=gha,mode=max,scope=base-dev
      
      - name: Build and push base image (prod dependencies)
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.base
          target: final-prod
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repository_lower }}/dharma-base-prod:${{ steps.cache-key.outputs.hash }}
            ghcr.io/${{ steps.repo.outputs.repository_lower }}/dharma-base-prod:latest
          cache-from: type=gha,scope=base-prod
          cache-to: type=gha,mode=max,scope=base-prod
      
      - name: Summary
        run: |
          echo "## Base Image Build Complete! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Base images have been built and pushed with the following tags:" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ steps.repo.outputs.repository_lower }}/dharma-base:${{ steps.cache-key.outputs.hash }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ steps.repo.outputs.repository_lower }}/dharma-base:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ steps.repo.outputs.repository_lower }}/dharma-base-prod:${{ steps.cache-key.outputs.hash }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ steps.repo.outputs.repository_lower }}/dharma-base-prod:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Future builds will use these base images for faster build times! ⚡" >> $GITHUB_STEP_SUMMARY

