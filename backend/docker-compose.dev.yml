services:
  db_write:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_WRITE_USER}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_PASSWORD: ${DB_WRITE_PASSWORD}
    env_file:
      - .env
    ports:
      - ${DB_WRITE_PORT}:5432
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

  db_read:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_READ_USER}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_PASSWORD: ${DB_READ_PASSWORD}
    env_file:
      - .env
    ports:
      - ${DB_READ_PORT}:5432
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

  zookeeper:
    image: wurstmeister/zookeeper:3.4.6
    ports:
      - 2181:2181
    networks:
      - app-network

  kafka:
    image: wurstmeister/kafka:2.12-2.5.0
    ports:
      - 9092:9092
    environment:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - app-network
    ports:
      - 3000:3000

    env_file:
      - .env
    depends_on:
      - db_write
      - kafka

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    ports:
      - 8080:80
    env_file:
      - .env
    networks:
      - app-network
    volumes:
      - ../frontend:/app
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
    driver: local
