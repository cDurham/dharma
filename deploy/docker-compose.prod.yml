services:
  # Database service removed - using AWS RDS instead
  # Kafka and Zookeeper removed - not needed (no consumers)
  
  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-dharma}/api:latest
    env_file: ../.env
    ports: [3000:3000]
    networks: [app-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/.well-known/apollo/server-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.8'

  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-dharma}/web:latest
    depends_on:
      api:
        condition: service_healthy
    ports: [8080:80]
    networks: [app-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'

networks:
  app-net: { driver: bridge }
