packages:
  - "apps/*"
  - "tools/*"
  - "packages/*"

# Catalog — single-source every version used by more than one workspace package.
# Members reference these as `"chalk": "catalog:"`, so a bump is one edit here and
# two packages can never silently drift onto different majors of the same library.
# Renovate updates the catalog entry directly; see renovate.json.
catalog:
  # Shared by apps/api and tools/cli (both ship a commander-based CLI surface).
  chalk: "6.0.0"
  commander: "15.0.0"
  ora: "9.4.1"
  prompts: "^2.4.2"
  yaml: "^2.9.0"

  # Shared by the root workspace and tools/cli.
  typescript: "7.0.2"
  "@types/node": "^26.2.0"
  "@types/prompts": "^2.4.9"
